[workspace]
members = [
    "crates/multicore-core",
    "crates/multicore-daemon",
    "crates/multicore-update",
    "crates/multicore-platform",
    "crates/multicore-i18n",
    "apps/multicore-desktop",
    "apps/multicore-core-host",
    "apps/multicore-updater",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "GPL-3.0-only"

[workspace.dependencies]
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
quick-xml = "0.41.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
resvg = { version = "0.47.0", default-features = false }
regex = "1"
# Pinned explicitly (matching a working precedent in the same problem
# domain - Clash Verge Rev does the same) instead of letting reqwest's
# plain "rustls" feature pull in aws-lc-rs. Rustls 0.23 links whichever
# crypto-provider features the dependency graph unifies to, and this
# workspace also carries reqwest 0.12 (apps/multicore-desktop), whose own
# "rustls-tls" feature defaults to ring - so the two majors were ending up
# with *both* aws-lc-rs and ring linked into the same desktop binary, a
# documented source of ambiguous/inconsistent crypto-provider
# initialization. See fetch.rs's `ensure_crypto_provider_installed`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10.9"
thiserror = "2"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
zeroize = { version = "1.9", features = ["derive"] }
