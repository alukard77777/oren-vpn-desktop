name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: [self-hosted, Windows, X64, windowsbuild]
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-pc-windows-msvc
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Expose cache compression tools
        shell: pwsh
        run: |
          $tools = Join-Path $env:ProgramFiles 'Git\usr\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $tools 'gzip.exe') -PathType Leaf)) {
            throw 'Git gzip is required by actions/cache on the Windows runner'
          }
          $tools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Restore Cargo build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          key: cargo-ci-nodebug-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.98.1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-ci-nodebug-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.98.1-
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1-x86_64-pc-windows-msvc --profile minimal --component rustfmt,clippy
          rustup default 1.98.1-x86_64-pc-windows-msvc
      - name: Verify
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-package-windows-release.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-smoke-test-one-click-contract.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-packaged-daemon-smoke-contract.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-windows-installer-contract.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-release-workflow-contract.ps1

  linux:
    runs-on: [self-hosted, Linux, X64, debian13]
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -o DPkg::Lock::Timeout=180 install -y --no-install-recommends zstd pkg-config libgtk-3-dev libxkbcommon-dev \
            libfontconfig-dev libfreetype-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl-dev libegl-dev
      - name: Restore Cargo build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          key: cargo-ci-nodebug-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.98.1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-ci-nodebug-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.98.1-
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
      - name: Verify
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          for script in scripts/*.sh; do bash -n "$script"; done

  linux-packages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: linux
    uses: ./.github/workflows/linux-packages.yml
