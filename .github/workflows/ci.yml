name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  windows:
    runs-on: [self-hosted, Windows, X64, windowsbuild]
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-pc-windows-msvc
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1-x86_64-pc-windows-msvc --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.98.1-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-package-windows-release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-smoke-test-one-click-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-packaged-daemon-smoke-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-windows-installer-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-release-workflow-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux:
    runs-on: [self-hosted, Linux, X64, debian13]
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0

    steps:
      - name: Recover host workspace ownership
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          runner_work="$(realpath -e -- "$(dirname -- "${RUNNER_TEMP:?}")")"
          expected="$runner_work/multicore/multicore"
          workspace="$(realpath -e -- "${GITHUB_WORKSPACE:?}")"
          [[ "$runner_work" != / && "$workspace" == "$expected" && -d "$workspace" ]] || {
            echo "Refusing ownership recovery outside the expected repository workspace" >&2
            exit 1
          }
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          [[ "$runner_uid" =~ ^[0-9]+$ && "$runner_uid" != 0 && "$runner_gid" =~ ^[0-9]+$ ]] || {
            echo "Ownership recovery requires a non-root host runner user" >&2
            exit 1
          }
          stat -c 'Workspace owner before recovery: %u:%g %n' -- "$expected"
          find "$expected" -maxdepth 2 -uid 0 -printf 'Root-owned entry before recovery: %U:%G %p\n' || true
          sudo chown -hR -P -- "$runner_uid:$runner_gid" "$expected"
          stat -c 'Workspace owner after recovery: %u:%g %n' -- "$expected"
          find "$expected" -maxdepth 2 -uid 0 -printf 'Root-owned entry after recovery: %U:%G %p\n'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -o DPkg::Lock::Timeout=180 install -y --no-install-recommends zstd python3 pkg-config libgtk-3-dev libxkbcommon-dev \
            libfontconfig-dev libfreetype-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl-dev libegl-dev \
            weston dbus-daemon libgl1-mesa-dri libegl-mesa0
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
      - name: Verify
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -B scripts/fixtures/test_runner_workspace_recovery.py

      - name: Test native Wayland window lifecycle
        run: bash scripts/test-linux-shell.sh
      - name: Retain native Wayland evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-shell-smoke
          path: artifacts/linux-shell/
          if-no-files-found: warn
          retention-days: 7

  linux-packages:
    if: github.event_name == 'push'
    needs: linux
    uses: ./.github/workflows/linux-packages.yml
    with:
      update-repository: fatyzzz/multicore-releases
