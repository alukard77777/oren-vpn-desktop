name: Build OREN VPN Desktop (Windows x64)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build OREN VPN Setup (x64)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust toolchain (1.98.1)
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1-x86_64-pc-windows-msvc --profile minimal
          rustup default 1.98.1-x86_64-pc-windows-msvc
          rustc -Vv
          cargo -V

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build OREN VPN Desktop Client
        shell: pwsh
        env:
          MULTICORE_UPDATE_REPOSITORY: alukard77777/oren-vpn-desktop
        run: |
          cargo build --release -p multicore-desktop
          if (-not (Test-Path "target/release/multicore-desktop.exe")) {
            throw "multicore-desktop.exe was not built"
          }
          Write-Host "OREN VPN desktop executable built successfully."

      - name: Download Upstream Runtime & Stage Package
        shell: pwsh
        run: |
          $stage = "dist/staging"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          
          $zipUrl = "https://github.com/fatyzzz/multicore/releases/download/v1.1.15/multicore-windows-x64.zip"
          $zipFile = "$env:RUNNER_TEMP/multicore-windows-x64.zip"
          Write-Host "Downloading runtime components from $zipUrl..."
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipFile
          
          Write-Host "Unpacking runtime bundle..."
          Expand-Archive -Path $zipFile -DestinationPath $stage -Force

          Write-Host "Injecting custom OREN VPN desktop client..."
          Copy-Item -Path "target/release/multicore-desktop.exe" -Destination "$stage/MultiCore.exe" -Force

          Write-Host "Updating SHA256 checksums..."
          $newHash = (Get-FileHash -Path "$stage/MultiCore.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sumFile = Join-Path $stage 'SHA256SUMS.txt'
          $lines = (Get-Content -Path $sumFile) | ForEach-Object {
            if ($_ -match '\*MultiCore\.exe$') {
              "$newHash *MultiCore.exe"
            } else {
              $_
            }
          }
          [IO.File]::WriteAllLines($sumFile, $lines, [Text.UTF8Encoding]::new($false))
          Write-Host "Staging ready with updated checksums."

      - name: Build Windows Installer
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows-installer.ps1 `
            -PackagePath dist/staging `
            -OutputDirectory dist/release `
            -AppVersion "1.1.15"

          if (-not (Test-Path "dist/release/MultiCore-Setup-x64.exe")) {
            throw "MultiCore-Setup-x64.exe was not created"
          }

          Copy-Item "dist/release/MultiCore-Setup-x64.exe" "dist/release/OREN-VPN-Setup-x64.exe" -Force
          Compress-Archive -Path "dist/staging/*" -DestinationPath "dist/release/OREN-VPN-Portable-x64.zip" -Force
          Write-Host "Release artifacts successfully created in dist/release:"
          Get-ChildItem "dist/release"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OREN-VPN-Windows-x64
          path: |
            dist/release/OREN-VPN-Setup-x64.exe
            dist/release/OREN-VPN-Portable-x64.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.1.15
          name: "OREN VPN Desktop v1.1.15"
          draft: false
          prerelease: false
          body: |
            ## OREN VPN Desktop (Windows x64)

            - **`OREN-VPN-Setup-x64.exe`** — Официальный инсталлятор (установка в `Program Files` или per-user).
            - **`OREN-VPN-Portable-x64.zip`** — Портативная версия (распакуй и запусти `MultiCore.exe`).

            ### Детали сборки:
            - **Фирменный стиль**: Тема *Cyber Crimson & Obsidian Dark* (акцент `#ff2a4d`, фон `#0b0b0f`, тёмные панели `#12121a`).
            - **Ядра**: Xray Core v26.9.30 + Mihomo v1.19.32 с поддержкой REALITY + MLKEM768.
            - **Поддерживаемые протоколы**: VLESS Reality (TCP/gRPC/XHTTP), Hysteria 2, Trojan, ShadowTLS, TUIC.
          files: |
            dist/release/OREN-VPN-Setup-x64.exe
            dist/release/OREN-VPN-Portable-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
