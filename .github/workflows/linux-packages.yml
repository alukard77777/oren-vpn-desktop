name: Linux packages

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  debian-appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config python3 unzip file xz-utils zstd \
            dpkg-dev libgtk-3-dev libxkbcommon-dev libfontconfig-dev libfreetype-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev libgl-dev libegl-dev
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustc -Vv
      - name: Stage release tree
        run: ./scripts/package-linux-release.sh --output target/linux-stage
      - name: Build Debian package and AppImage
        run: ./scripts/build-linux-packages.sh --stage target/linux-stage --output dist/linux --formats deb,appimage
      - name: Archive stage for the Arch package
        run: tar --zstd -C target -cf linux-stage.tar.zst linux-stage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages-debian-appimage
          path: dist/linux/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-stage
          path: linux-stage.tar.zst
          if-no-files-found: error
          retention-days: 1

  arch:
    needs: debian-appimage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-stage
      - name: Build Arch package
        run: |
          pacman -Syu --noconfirm --needed zstd
          useradd --create-home builder
          mkdir -p target
          tar --zstd -xf linux-stage.tar.zst -C target
          chown -R builder: .
          su builder -c './scripts/build-linux-packages.sh --stage target/linux-stage --output dist/linux --formats arch'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages-arch
          path: dist/linux/
          if-no-files-found: error
