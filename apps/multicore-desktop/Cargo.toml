[package]
name = "multicore-desktop"
version = "1.1.7"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
# Already built for Slint (i-slint-core); used for the local timestamp of a saved log archive.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
copypasta = "0.10.2"
getrandom = "0.4"
image.workspace = true
multicore-platform = { path = "../../crates/multicore-platform" }
multicore-core = { path = "../../crates/multicore-core" }
multicore-i18n = { path = "../../crates/multicore-i18n" }
multicore-release = { path = "../../crates/multicore-update" }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
# The GPU renderer is Skia: Direct3D 12 on Windows, OpenGL on Linux (see
# src/renderer_fallback.rs and docs/renderer.md). Slint's software renderer is
# the fallback when the GPU renderer cannot start.
slint = { version = "=1.17.0", default-features = false, features = ["std", "backend-winit", "renderer-skia", "renderer-software", "software-renderer-path", "software-renderer-systemfonts", "compat-1-2", "unstable-winit-030"] }
# Already vendored transitively by Slint's winit backend at this exact version; used directly
# here only to open the Mihomo dashboard URL in the system's default browser.
webbrowser = "=1.2.4"
# Already in the workspace for update archives; writes the «Сохранить лог…» archive.
zip.workspace = true

[features]
# Offscreen preview renderer used by `render_ui_previews` (ignored test). It
# enables Slint's software renderer so screenshots need no GPU, window or daemon.
preview-render = ["slint/renderer-software", "slint/software-renderer-path", "slint/software-renderer-systemfonts"]

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
tray-icon = { version = "=0.25.1", default-features = false, features = ["libappindicator"] }
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "=0.25.1", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Slint's own core at its exact version: tests walk the item tree to see which rows of a
# virtualized list exist.
i-slint-core = { version = "=1.17.0", default-features = false }
multicore-platform = { path = "../../crates/multicore-platform", features = ["test-support"] }
tempfile = "3"

[build-dependencies]
embed-resource = "=3.0.11"
ico = "=0.5.0"
resvg.workspace = true
slint-build = "=1.17.0"
