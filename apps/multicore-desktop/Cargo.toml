[package]
name = "multicore-desktop"
version = "0.1.7"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
copypasta = "0.10.2"
getrandom = "0.4"
image.workspace = true
multicore-platform = { path = "../../crates/multicore-platform" }
multicore-release = { path = "../../crates/multicore-update" }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.17.0", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2", "unstable-winit-030"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
tray-icon = { version = "=0.25.1", default-features = false, features = ["libappindicator"] }
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "=0.25.1", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[dev-dependencies]
multicore-platform = { path = "../../crates/multicore-platform", features = ["test-support"] }
tempfile = "3"

[build-dependencies]
embed-resource = "=3.0.11"
ico = "=0.5.0"
slint-build = "=1.17.0"
